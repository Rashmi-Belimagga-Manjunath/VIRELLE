# Render Blueprint — deploys the VIRELLE backend to a free web service.
# The frontend lives on GitHub Pages (submitted link) and calls this API.
#
# How to deploy (one time, ~5 minutes):
#   1. Create a free account at https://render.com (sign in with GitHub)
#   2. Click "New +" -> "Blueprint"
#   3. Select this repository -> Render reads render.yaml and provisions the service
#   4. In the dashboard, open the service -> Environment -> set OPENAI_API_KEY
#      (it is marked "requires a value" and is stored as a Render secret, never in code)
#   5. Deploy. Your API base will be https://<service-name>.onrender.com
#   6. Tell the project owner the URL so GitHub Pages is rebuilt to call it.

services:
  - type: web
    name: virelle-live
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: VIRELLE_OPENAI_MODEL
        value: gpt-4o
      - key: VIRELLE_GOOGLE_SHEET_URLS
        value: '{"Hotel":"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0ANKCNCzqnBd6TKHXtM_9e3SAeQKaobdTsup0Nx-JJ71V_yBgaOx177_fkp8LcOlGhewAZ9qXkYKZ/pub?output=csv&gid=0","Rooms":"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0ANKCNCzqnBd6TKHXtM_9e3SAeQKaobdTsup0Nx-JJ71V_yBgaOx177_fkp8LcOlGhewAZ9qXkYKZ/pub?output=csv&gid=2021399226","Inventory":"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0ANKCNCzqnBd6TKHXtM_9e3SAeQKaobdTsup0Nx-JJ71V_yBgaOx177_fkp8LcOlGhewAZ9qXkYKZ/pub?output=csv&gid=409885091","Packages":"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0ANKCNCzqnBd6TKHXtM_9e3SAeQKaobdTsup0Nx-JJ71V_yBgaOx177_fkp8LcOlGhewAZ9qXkYKZ/pub?output=csv&gid=1919088254","Facilities":"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0ANKCNCzqnBd6TKHXtM_9e3SAeQKaobdTsup0Nx-JJ71V_yBgaOx177_fkp8LcOlGhewAZ9qXkYKZ/pub?output=csv&gid=1351694943"}'
